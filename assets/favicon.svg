<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#121216"/>

  <!-- Traffic signal housing -->
  <rect x="22" y="6" width="20" height="48" rx="5" fill="#1e1e26" stroke="#2a2a38" stroke-width="1.5"/>

  <!-- Red light -->
  <circle cx="32" cy="16" r="6" fill="#e53e3e" opacity="0.9"/>
  <circle cx="32" cy="16" r="3.5" fill="#fc8181" opacity="0.6"/>

  <!-- Amber light -->
  <circle cx="32" cy="32" r="6" fill="#c8a03c" opacity="0.95"/>
  <circle cx="32" cy="32" r="3.5" fill="#f6d860" opacity="0.7"/>

  <!-- Green light -->
  <circle cx="32" cy="48" r="6" fill="#2d9e6b" opacity="0.85"/>
  <circle cx="32" cy="48" r="3.5" fill="#68d391" opacity="0.5"/>

  <!-- Mounting post -->
  <rect x="30" y="54" width="4" height="6" rx="2" fill="#2a2a38"/>
</svg>
